<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box{fill:#161b22;stroke:#30363d;stroke-width:1.2}
    .hl{stroke:#7ee787}
    .lb{font-size:13px;fill:#c9d1d9}
    .sm{font-size:11px;fill:#8b949e}
    .ln{stroke:#3fb950;stroke-width:1.5;fill:none;stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
  </style>
  <rect width="860" height="300" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="30" class="sm"># almondyoung — production topology (simplified)</text>

  <!-- clients -->
  <rect x="30" y="70" width="150" height="54" rx="8" class="box"/>
  <text x="105" y="94" text-anchor="middle" class="lb">Web (Next.js)</text>
  <text x="105" y="112" text-anchor="middle" class="sm">storefront</text>
  <rect x="30" y="170" width="150" height="54" rx="8" class="box"/>
  <text x="105" y="194" text-anchor="middle" class="lb">App (React Native)</text>
  <text x="105" y="212" text-anchor="middle" class="sm">mobile</text>

  <!-- gateway -->
  <rect x="250" y="120" width="140" height="54" rx="8" class="box hl"/>
  <text x="320" y="144" text-anchor="middle" class="lb">API Gateway</text>
  <text x="320" y="162" text-anchor="middle" class="sm">NestJS</text>

  <!-- services -->
  <rect x="460" y="56" width="180" height="182" rx="8" class="box"/>
  <text x="550" y="80" text-anchor="middle" class="lb">Microservices ×14</text>
  <text x="480" y="108" class="sm">├─ commerce  (Medusa.js)</text>
  <text x="480" y="128" class="sm">├─ auth / user</text>
  <text x="480" y="148" class="sm">├─ order / payment</text>
  <text x="480" y="168" class="sm">├─ product / search</text>
  <text x="480" y="188" class="sm">├─ notification / sms</text>
  <text x="480" y="208" class="sm">└─ …</text>

  <!-- data -->
  <rect x="700" y="80" width="130" height="54" rx="8" class="box"/>
  <text x="765" y="104" text-anchor="middle" class="lb">PostgreSQL</text>
  <text x="765" y="122" text-anchor="middle" class="sm">Drizzle ORM</text>
  <rect x="700" y="160" width="130" height="54" rx="8" class="box"/>
  <text x="765" y="184" text-anchor="middle" class="lb">Railway</text>
  <text x="765" y="202" text-anchor="middle" class="sm">Docker deploy</text>

  <path class="ln" d="M180 97 C215 97 215 147 250 147"/>
  <path class="ln" d="M180 197 C215 197 215 147 250 147"/>
  <path class="ln" d="M390 147 L460 147"/>
  <path class="ln" d="M640 107 L700 107"/>
  <path class="ln" d="M640 187 L700 187"/>

  <text x="22" y="282" class="sm">$ docker compose ps  →  all services healthy ✓</text>
</svg>
